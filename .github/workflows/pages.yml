# Veröffentlicht den Ordner app/ auf GitHub Pages, sobald sich auf main etwas daran ändert.
# Voraussetzung (einmalig): Settings → Pages → Source: „GitHub Actions".
# Vorbild: Bestell Software 2.0/.github/workflows/pages.yml
name: App veröffentlichen

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.bereitstellung.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: bereitstellung
        uses: actions/deploy-pages@v4
